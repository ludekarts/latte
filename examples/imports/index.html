<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Latte multiple imports tests</title>

    <style>
      code {
        background-color: lightblue;
        display: inline-block;
        padding: 0 0.2em;
      }
    </style>

    <script type="module">
      import chai from "https://cdn.jsdelivr.net/npm/chai@4.3.10/+esm";
      import chaiSpies from "https://cdn.jsdelivr.net/npm/chai-spies@1.1.0/+esm";
      chai.use(chaiSpies);

      window.chai = chai;
      window.expect = chai.expect;
    </script>
  </head>
  <body>
    <p>
      This example shows how to combine tests from multiple files and how to
      combine them with asynchronous chai imports.
    </p>
    <script
      type="module"
      data-chai="false"
      src="../../index.js"
      data-latte-tests="./imports.test.js"
    ></script>
  </body>
</html>
